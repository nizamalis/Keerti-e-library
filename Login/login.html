<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Login</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="/Login/login.css">
</head>

<body>


    <h2 class=" text-white mb-4">keerti-E-Library</h2>
<div class="container d-flex justify-content-center align-items-center vh-100">

    <div class="card login-card">

        <div class="login-header text-center"><img src="/png/images.png" alt="Logo"  width="70" height="70" class="login-logo mb-2">
           <b>keerti-E-Library</b>
        </div>

        <div class="card-body">

            <form id="loginForm">

                <div class="mb-3">
                    <label class="form-label">Student ID / Email</label>
                    <input type="text"
                           class="form-control"
                           placeholder="Enter Student ID or Email"
                           autocomplete="off">
                </div>

                <div class="mb-3">
                    <label class="form-label">Password</label>

                    <div class="input-group">

                        <input type="password"
                               id="password"
                               class="form-control"
                               placeholder="Enter Password">

                        <span class="input-group-text">
                            <i class="bi bi-eye-slash" id="togglePassword"></i>
                        </span>

                    </div>
                </div>

                <div class="d-flex justify-content-between mb-4">

                    <div class="form-check">
                        <input class="form-check-input" type="checkbox">
                        <label class="form-check-label">
                            Remember Me
                        </label>
                    </div>

                    <a href="#" class="text-decoration-none">
                        Forgot Password?
                    </a>

                </div>

                <button type="submit" class="btn btn-info btn-login">
                    Login
                </button>

                <p class="text-center mt-4">
                    <em>Read • Learn • Grow</em>
                </p>

            </form>

        </div>

    </div>

</div>

<!-- <script src="js/login.js"></script> -->
<script src="../js/login.js"></script>


</body>
</html>
